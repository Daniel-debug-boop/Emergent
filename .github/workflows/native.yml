name: Native

# The native tree is C++ against pinned upstream libraries (Jolt, Recast/Detour,
# Volk, VMA, meshoptimizer, Flecs, miniaudio, ozz-animation, Zstandard, Tracy).
# For a long stretch it was never compiled at all: the sources were
# syntactically plausible but had real API errors that only appeared once a
# compiler was pointed at them, and a CMake tag (`1.4.328`) that does not exist
# upstream. This job keeps that from silently rotting again.

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'native/**'
      - '.github/workflows/native.yml'

jobs:
  native:
    name: Build and test native engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libvulkan-dev

      # ozz requires CMake >= 3.30; distribution packages trail that (Ubuntu
      # 22.04 ships 3.22). Pin the toolchain explicitly rather than depending on
      # whatever the runner image happens to provide.
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.5'

      # Pinned upstream trees, cloned at the exact revisions CMakeLists expects.
      # Kept out of git; the repository depends on them, it does not vendor them.
      - name: Fetch pinned upstream dependencies
        run: |
          set -euo pipefail
          mkdir -p third_party
          fetch() { git clone --depth 1 --branch "$2" "$3" "third_party/$1"; }
          fetch JoltPhysics            v5.6.0            https://github.com/jrouwe/JoltPhysics.git
          fetch meshoptimizer          v1.2              https://github.com/zeux/meshoptimizer.git
          fetch recastnavigation       v1.6.0            https://github.com/recastnavigation/RecastNavigation.git
          # Volk tags releases vulkan-sdk-<version>; a bare 1.4.328 does not exist.
          fetch volk                   vulkan-sdk-1.4.328.0 https://github.com/zeux/volk.git
          fetch VulkanMemoryAllocator  v3.3.0            https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git
          fetch flecs                  v4.0.5            https://github.com/SanderMertens/flecs.git
          fetch miniaudio              0.11.25           https://github.com/mackron/miniaudio.git
          fetch ozz-animation          0.17.0            https://github.com/guillaumeblanc/ozz-animation.git
          fetch zstd                   v1.5.7            https://github.com/facebook/zstd.git
          # Tracy is fetched so the option is exercised, but capture stays off:
          # its client streams to a Tracy server, and a CI runner has none.
          fetch tracy                  v0.13.0           https://github.com/wolfpld/tracy.git

      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMERGENT_JOLT_DIR="$PWD/third_party/JoltPhysics" \
            -DEMERGENT_MESHOPTIMIZER_DIR="$PWD/third_party/meshoptimizer" \
            -DEMERGENT_RECAST_DIR="$PWD/third_party/recastnavigation" \
            -DEMERGENT_VOLK_DIR="$PWD/third_party/volk" \
            -DEMERGENT_VMA_DIR="$PWD/third_party/VulkanMemoryAllocator" \
            -DEMERGENT_FLECS_DIR="$PWD/third_party/flecs" \
            -DEMERGENT_MINIAUDIO_DIR="$PWD/third_party/miniaudio" \
            -DEMERGENT_OZZ_DIR="$PWD/third_party/ozz-animation" \
            -DEMERGENT_ZSTD_DIR="$PWD/third_party/zstd" \
            -DEMERGENT_TRACY_DIR="$PWD/third_party/tracy"

      # Every target, not a list of them. The list was here to keep the job
      # quick, and it cost this job twice: ctest reports a test whose executable
      # was never built as "Not Run" rather than as a build failure, so a new
      # test that nobody remembered to add to the list passed CI by not existing.
      # Three of them did exactly that. `all` makes the omission impossible.
      - name: Build
        run: cmake --build build/native

      # No GPU is present on the runner, so the Vulkan backend reports
      # VK_ERROR_INCOMPATIBLE_DRIVER by design and the tests assert the
      # subsystems that do not need a driver. The binary is still required to
      # link, which is what proves the VMA/volk/Flecs/Jolt integration.
      - name: Test
        run: ctest --test-dir build/native --output-on-failure

      # The self-test writes a real profile; publishing it makes an
      # unmeasured subsystem visible instead of leaving it implied.
      - name: Upload the profile the self-test produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergent-profile
          path: build/native/emergent_profile.json
          if-no-files-found: warn

      # Tracy's client is linked and its tests run when EMERGENT_ENABLE_TRACY=ON.
      # Testing it here is what stops the option from rotting into a flag that
      # no longer compiles — which it already had twice: TRACY_ENABLE was forced
      # off, so the profiling library built and every consumer then failed to
      # link on tracy::GetProfiler(); and this step initially built only one of
      # the four test executables, so ctest reported the other three as "Not Run".
      # No capture is taken, because there is no server to take one from, and the
      # profiling test reports exactly that.
      - name: Build and test the Tracy-enabled configuration
        run: |
          cmake -S . -B build/tracy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEMERGENT_BUILD_ENGINE=OFF \
            -DEMERGENT_ENABLE_TRACY=ON \
            -DEMERGENT_JOLT_DIR="$PWD/third_party/JoltPhysics" \
            -DEMERGENT_OZZ_DIR="$PWD/third_party/ozz-animation" \
            -DEMERGENT_ZSTD_DIR="$PWD/third_party/zstd" \
            -DEMERGENT_TRACY_DIR="$PWD/third_party/tracy"
          # `all` rather than a list, for the reason in the Build step above: a
          # named list omits new test executables silently, and ctest scores a
          # missing executable as "Not Run" rather than as a failure. This
          # configuration turns the engine off, so `all` is still a short build.
          cmake --build build/tracy
          ctest --test-dir build/tracy --output-on-failure

      # The frame loop is the one subsystem whose bugs are invisible: a loop
      # that runs, animates and does not crash can still be advancing physics
      # at the frame rate, interpolating one substep behind, or stepping
      # animation once per substep. These two runs pin the two paths the test
      # binary cannot see - the shipped executable driven from its CLI, and
      # the real-time clock rather than a fixed delta. The 90 Hz first leg
      # matters specifically because 90 is not a multiple of 60: it is the case
      # where a loop that wrongly ties steps to frames drifts visibly.
      - name: Run the shipped frame loop at three rates
        run: |
          for hz in 30 90 144; do
            echo "=== ${hz} Hz, four seconds ==="
            ./build/native/emergent_native --hz "$hz" --frames $((hz * 4)) --walk
          done

      - name: Run the shipped frame loop against the real clock
        run: ./build/native/emergent_native --realtime 1.0 --walk
