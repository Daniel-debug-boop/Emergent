name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rapier is a real runtime dependency: the game imports it, the build
      # vendors it, and test_physics.mjs executes it. The lockfile is committed
      # so this resolves the exact version the tests were written against.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      # Runs the world, math, culling, missions, geometry, shader, shading,
      # physics, input, project, tooling and runtime suites.
      #
      # The shader suites are the ones that matter most here and exist because
      # the harness cannot compile GLSL or rasterize: `test_shaders.mjs` parses
      # every shader with a real parser and asserts that each uniform the
      # renderer sets is declared, each declared uniform is set, and the vertex
      # shader reads all four attributes the buffers upload; `test_shading.mjs`
      # transliterates the BRDF into JS and asserts its physical behaviour. The
      # entire material system once ran green against a fragment shader that
      # read only three of the four attributes, so both directions are checked.
      #
      # The physics suite executes the real Rapier engine, the geometry suite
      # executes the real material table and detail kit, and the runtime suite
      # executes the real game frame loop against a validating WebGL2 surface,
      # so no GPU or browser is required in CI.
      - name: Test
        run: npm test

      # The native renderer is no longer a debug presentation layer over a
      # scene of boxes: it generates the same city the JavaScript does, from the
      # same seed, and the parity test is what makes that checkable. It needs the
      # fixture, which is generated from world.mjs and committed, so this is a
      # guard that the committed fixture still matches the generator it claims
      # to describe -- if world.mjs moves, the fixture is stale and the parity
      # test is asserting against a city that no longer exists.
      - name: Verify the world parity fixture is current
        run: |
          node tools/gen_world_fixture.mjs
          if ! git diff --quiet -- native/tests/world_fixture.txt; then
            echo "::error::world_fixture.txt is stale. Run 'npm run test:fixture' and commit it."
            git diff --stat -- native/tests/world_fixture.txt
            exit 1
          fi
          echo "world fixture matches world.mjs" 

      # Every third-party asset in the game is named in a manifest with its
      # licence, its source URL and its author. This fails the build if any of
      # them stops being CC0, loses its provenance, or stops matching what
      # actually ships — which is the only way "these assets can legally ship"
      # stays true rather than being a claim in a README.
      - name: Audit assets
        run: npm run assets:audit

      - name: Build
        run: npm run build

      # The build is only correct if the vendored physics engine actually
      # shipped. A green build that omitted it would pass every other check
      # here and 404 on the player's first frame.
      - name: Verify build output
        run: |
          test -s dist/index.html -a -s dist/game3d.js -a -s dist/physics.mjs -a -s dist/input.mjs
          test -s dist/vendor/rapier.mjs
          cmp dist/vendor/rapier.mjs node_modules/@dimforge/rapier3d-compat/dist/rapier.mjs
          echo "vendored rapier is byte-identical to the tested dependency"

      # A build that shipped the code but not the material set would pass every
      # check above and 404 on the player's first frame. The count comes from
      # the descriptor, so adding a material cannot quietly break this.
      - name: Verify the material set shipped
        run: |
          test -s dist/assets/textures/materials.mjs
          for m in albedo normal arm; do
            n=$(ls dist/assets/textures/*_$m.png | wc -l)
            echo "  $m: $n tiles"
            test "$n" -ge 26
          done
          du -sh dist/assets/textures
